<div class="workbench-modal-backdrop bounty-dialog" id="bounty-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="bounty-dialog-title" onclick="handleBountyBackdropClick(event)" onkeydown="handleBountyDialogKeydown(event)">
  <div class="bounty-dialog-window" onclick="event.stopPropagation()">
    <header class="bounty-dialog-header"><div><h2 id="bounty-dialog-title">🏅 亲子悬赏契约</h2><p>一起约定挑战，用真实过程见证成长</p></div><button type="button" class="bounty-close" aria-label="关闭悬赏契约" onclick="closeBountyModal()">✕</button></header>
    <div class="bounty-dialog-toolbar"><span id="bounty-modal-status-badge">待立约</span><button type="button" onclick="toggleBountyPublishForm()">＋ 发布新契约</button></div>
    <div id="bounty-modal-body" class="bounty-dialog-body">
      <section id="bounty-publish-form-box" class="bounty-panel bounty-publish" style="display:none"><h3>约定一个新挑战</h3><label>挑战主题<input id="bounty-new-title" maxlength="60" placeholder="例如：独立完成一个观察项目"></label><div class="bounty-form-grid"><label>成长场馆<select id="bounty-new-pavilion"><option>校史馆 · 学业攻坚</option><option>武道馆 · 兴趣成长</option><option>思辨馆 · 思考探索</option><option>修身阁 · 知行合一</option></select></label><label>挑战期限（天）<input id="bounty-new-days" type="number" min="1" max="366" value="7"></label></div><label>共同约定的体验心愿<input id="bounty-new-reward" placeholder="例如：一次亲子自然探索"></label><label>验收标准<textarea id="bounty-new-criteria" rows="3" placeholder="写清要完成什么，以及如何共同验收"></textarea></label><button type="button" class="bounty-primary" onclick="submitNewParentBounty()">发布契约</button></section>
      <section class="bounty-panel bounty-current"><p id="bounty-modal-meta" class="bounty-muted"></p><h3 id="bounty-modal-title"></h3><p id="bounty-modal-contract-no" class="bounty-muted"></p><div class="bounty-reward"><span>🎁 约定心愿</span><strong id="bounty-modal-reward"></strong></div><h4>📋 验收标准</h4><p id="bounty-modal-criteria"></p><ol class="bounty-steps"><li>① 家长立约</li><li id="bounty-stage2-status">② 孩子揭榜</li><li id="bounty-stage3-status">③ 共同验收</li></ol><p id="bounty-stage2-desc" class="bounty-muted"></p></section>
      <section class="bounty-panel bounty-delivery"><h3>📸 留下挑战过程</h3><div id="bounty-media-controls"></div><div id="bounty-media-list" class="bounty-media-list"></div></section>
      <section class="bounty-panel bounty-verification"><h3>🤝 共同验收</h3><label>家长验收寄语<textarea id="bounty-parent-comment-input" rows="3" placeholder="对照标准，写下真实观察与鼓励"></textarea></label><label class="bounty-check"><input type="checkbox" id="domain-parent-confirm">已共同核验原件和验收标准</label><p id="bounty-parent-stamp" class="bounty-muted"></p></section>
      <section id="domain-bounty-history" class="bounty-history"></section>
    </div>
    <footer class="bounty-dialog-footer"><span>真实交付 · 共同见证</span><div><button type="button" onclick="closeBountyModal()">关闭</button><button type="button" class="bounty-primary" id="bounty-action-accept-btn" onclick="acceptParentBounty()">揭榜应战</button><button type="button" class="bounty-primary" id="bounty-action-redeem-btn" onclick="completeBountyDemo()">核验通过并兑现</button></div></footer>
  </div>
</div>
