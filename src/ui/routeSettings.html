<div class="a-my-island-work-edge-popover is-hidden" id="tertiary-edge-popover" role="dialog" aria-label="路线设置" onclick="event.stopPropagation()">
  <header class="route-settings-header"><div class="a-my-island-work-edge-popover-title">路线设置</div><button type="button" class="route-settings-close" aria-label="关闭路线设置" onclick="closeRouteSettings()">✕</button></header>
  <div class="route-settings-body">
    <fieldset class="route-settings-section"><legend>上下级关系</legend><p class="route-settings-hint">选择父节点到子节点的方向，下级可随父节点移动。</p><div class="a-my-island-work-edge-hierarchy-actions"><button type="button" id="btn-edge-hier-forward" onclick="handleEdgeHierarchy(false)">节点A → 节点B</button><button type="button" id="btn-edge-hier-backward" onclick="handleEdgeHierarchy(true)">节点B → 节点A</button></div></fieldset>
    <fieldset class="route-settings-section"><legend>关系类别</legend><select class="a-my-island-work-edge-popover-select" id="edge-type-select" aria-label="关系类别" onchange="handleEdgeTypeSelect(this.value)"><option value="包含">包含</option><option value="前置">前置</option><option value="关联" selected>关联</option><option value="阻塞">阻塞</option><option value="通往">通往</option><option value="依赖">依赖</option><option value="none">无</option><option value="派生">派生</option></select></fieldset>
    <fieldset class="route-settings-section"><legend>箭头与方向</legend><div class="route-settings-choice-row"><button type="button" class="btn-arrow-mode" data-mode="single" onclick="setEdgeArrowMode('single')">单向</button><button type="button" class="btn-arrow-mode" data-mode="double" onclick="setEdgeArrowMode('double')">双向</button><button type="button" class="btn-arrow-mode" data-mode="none" onclick="setEdgeArrowMode('none')">无向</button></div><button type="button" class="route-settings-reverse" onclick="reverseEdgeDirection()">⇄ 仅反转线路方向</button></fieldset>
    <fieldset class="route-settings-section"><legend>线条样式</legend><div class="route-settings-choice-row"><button type="button" class="btn-line-style" data-style="solid" onclick="setEdgeLineStyle('solid')">实线</button><button type="button" class="btn-line-style" data-style="dashed" onclick="setEdgeLineStyle('dashed')">虚线</button></div><div class="a-my-island-work-edge-width-field"><label class="a-my-island-work-edge-width-header" for="edge-width-slider"><span>线条粗细</span><span id="edge-width-display">3档</span></label><input type="range" id="edge-width-slider" min="1" max="6" step="1" value="3" aria-label="线条粗细" oninput="handleEdgeWidthInput(this.value)"></div><div class="a-my-island-work-edge-colors" id="edge-color-swatches" aria-label="线路颜色"></div></fieldset>
    <label class="route-settings-name">关系名称<input type="text" class="a-my-island-work-edge-name" id="edge-custom-label-input" placeholder="输入关系名称" oninput="handleEdgeLabelChange(this.value)"></label>
  </div>
  <footer class="route-settings-footer"><button type="button" class="a-my-island-work-edge-popover-delete" onclick="handleDeleteActiveEdge()">删除路线</button></footer>
</div>
