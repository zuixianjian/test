name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies & build
        run: |
          npm install
          npm run build

      - name: Read version from manifest.json
        id: manifest
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare release packages
        run: |
          mkdir -p release/youth-holistic-growth-island
          cp manifest.json main.js styles.css versions.json release/youth-holistic-growth-island/
          if [ -d "assets" ]; then cp -r assets release/youth-holistic-growth-island/; fi
          cd release
          # 1. Folder zip (for extracting into .obsidian/plugins)
          zip -r youth-holistic-growth-island-folder.zip youth-holistic-growth-island
          # 2. Flat zip (for extracting into .obsidian/plugins/youth-holistic-growth-island)
          cd youth-holistic-growth-island && zip -r ../youth-holistic-growth-island.zip ./* && cd ..
          cd ..

      - name: Create or Update GitHub Release for Obsidian / BRAT
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.manifest.outputs.version }} - 终身岛民·青少儿全人成长与自主进化系统"
          body: |
            ### 🏝️ 终身岛民 · 青少儿全人成长与自主进化系统 v${{ steps.manifest.outputs.version }}
            - 支持通过 **Obsidian BRAT** 插件输入本仓库地址一键远程拉取安装与自动更新
            - 包含标准 Obsidian Release 资产：`manifest.json`、`main.js`、`styles.css`、`versions.json`
            - 包含即插即用完整离线离线资源包：`youth-holistic-growth-island.zip`（内含完整场景高精度离线插画与角色形象）
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            manifest.json
            main.js
            styles.css
            versions.json
            release/youth-holistic-growth-island.zip
